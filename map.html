<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bản đồ khách hàng · Khung năng lực Kinh doanh Sapo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<style>
  #mapwrap{max-width:1180px;margin:0 auto;padding:0 16px 40px}
  #mapframe{width:100%;height:78vh;min-height:520px;border:1px solid var(--line);border-radius:14px;background:#fff}
  .maptools{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 16px}
  .maptools a{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13.5px;color:#17130D;text-decoration:none}
  .maptools a:hover{border-color:var(--gold1)}
</style>
</head>
<body data-page="map">

<div class="topbar"><div class="wrap">
  <a class="brand" href="index.html"><span class="dot"></span> Khung năng lực Kinh doanh</a>
  <nav class="nav" id="nav"></nav>
</div></div>

<header class="hero">
  <span class="box1"></span><span class="box2"></span>
  <div class="wrap">
    <div class="eyebrow">Công cụ bán hàng</div>
    <h1>🗺️ Bản đồ khách hàng</h1>
    <p>Tra cứu khách hàng quanh một địa chỉ hoặc link Google Maps, ghim vị trí và xem danh sách địa điểm ngay trên bản đồ.</p>
  </div>
</header>

<main class="wrap">
  <section class="section" style="padding-top:22px">
    <div id="mapwrap">
      <div class="maptools">
        <a href="https://sapo-customer-map.netlify.app/" target="_blank" rel="noopener">↗ Mở toàn màn hình</a>
      </div>
      <iframe id="mapframe" src="https://sapo-customer-map.netlify.app/"
        allow="geolocation; clipboard-write" referrerpolicy="no-referrer-when-downgrade"
        title="Bản đồ khách hàng Sapo"></iframe>
    </div>
  </section>
</main>

<footer class="foot" id="foot"></footer>
<script src="framework-data.js"></script>
<script src="app.js"></script>
</body>
</html>
